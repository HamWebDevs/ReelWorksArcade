name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_BIN: /home/runner/.local/bin/godot
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Godot 4.7.2 and matching templates
        run: python3 tools/install_godot.py --directory /home/runner/.local/bin
      - name: Import and validate GDScript
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          python3 tools/check_godot_log.py "$RUNNER_TEMP/import.log"
      - name: Run gameplay and persistence tests
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          python3 tools/check_godot_log.py "$RUNNER_TEMP/tests.log"
      - name: Validate native UI and action reachability
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/ui-save" "$GODOT_BIN" --headless --path . --script res://tests/ui_smoke.gd 2>&1 | tee "$RUNNER_TEMP/ui.log"
          python3 tools/check_godot_log.py "$RUNNER_TEMP/ui.log"
      - name: Simulate at least 100,000 spins and feature transitions
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/simulation.gd 2>&1 | tee "$RUNNER_TEMP/simulation.log"
          python3 tools/check_godot_log.py "$RUNNER_TEMP/simulation.log"
      - name: Export and verify temporary-signed debug APK
        run: bash tools/export_android.sh
      - name: Prepare downloadable APK bundle
        run: |
          mkdir -p builds/artifact
          cp builds/ReelworksArcade-debug.apk builds/ReelworksArcade-debug.apk.sha256 builds/artifact/
          cp builds/test-results.json builds/simulation-results.json builds/artifact/
          cp "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/ui.log" "$RUNNER_TEMP/simulation.log" builds/artifact/
      - name: Upload debug APK artifact
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ReelworksArcade-debug
          path: builds/artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Add download instructions
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          python3 - <<'PY_SUMMARY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## APK ready\n\n')
              report.write('[Download ReelworksArcade-debug](' + os.environ['APK_ARTIFACT_URL'] + ')\n\n')
              report.write('Sign in to GitHub, download and extract the ZIP, then open `ReelworksArcade-debug.apk` on your Android phone.\n\n')
              report.write('ARM64 development build. Fictional credits only. No store publication.\n')
          PY_SUMMARY
